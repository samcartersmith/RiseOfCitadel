<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulwark Sandbox · Rise of Citadel</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1a1f;
        color: #efe6d2;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #panel {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 8px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.6);
      }
      #panel button {
        font: inherit;
        color: inherit;
        background: #2e2b33;
        border: 1px solid #5e5a63;
        border-radius: 4px;
        padding: 3px 7px;
        cursor: pointer;
      }
      #panel button.on {
        background: #b07a3c;
        border-color: #e8b54a;
      }
      #panel label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      #labels {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        pointer-events: none;
      }
      #labels div {
        padding: 4px 6px;
        border-radius: 4px;
        background: rgb(0 0 0 / 0.55);
        white-space: pre;
        overflow: hidden;
      }
      #labels div.sel {
        outline: 1px solid #e8b54a;
      }
      #labels div.flash {
        background: rgb(229 72 77 / 0.7);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="labels"></div>
    <div id="panel"></div>
    <script type="module" src="/src/sandbox/bulwark.ts"></script>
  </body>
</html>
